[project]
name = "recapit-ai"
version = "0.1.0"
description = "AI pipelines for Recapit"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.0,<3.0.0"
]

[project.optional-dependencies]
whisper = [
  "openai-whisper>=20231117",
  "torch>=2.0.0",
  "torchaudio>=2.0.0",
  "pydub>=0.25.1",
  "soundfile>=0.12.1",
  "ffmpeg-python>=0.2.0",
  "pyannote.audio>=3.1.0",
  "pyannote.core>=5.0.0",
  "transformers>=4.30.0",
  "numpy>=1.23.0",
  "scipy>=1.10.0",
]
monitoring = ["wandb>=0.17.0"]
