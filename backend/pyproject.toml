[project]
name = "recapit-backend"
version = "0.1.0"
description = "Backend API and orchestration layer for the Recapit meeting summarizer."
requires-python = ">=3.11"
authors = [{ name = "Recapit", email = "founders@recapit.ai" }]
readme = "README.md"
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<0.31.0",
  "pymongo>=4.8.0,<5.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "python-multipart>=0.0.9,<0.1.0",
  "transformers>=4.44.0,<5.0.0",
  "torch>=2.4.0,<3.0.0",
  "librosa>=0.10.1,<0.11.0",
  "pyannote.audio>=3.3.1,<4.0.0",
  "SpeechRecognition>=3.10.0,<4.0.0",
  "pydub>=0.25.1,<0.26.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0,<0.7.0",
  "pytest>=8.3.0,<9.0.0",
  "httpx>=0.27.0,<0.28.0"
]

[project.scripts]
recapit-api = "app.main:app"

[tool.uvicorn]
factory = false
app = "app.main:app"
host = "0.0.0.0"
port = 8080
reload = true
